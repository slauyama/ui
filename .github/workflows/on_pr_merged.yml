name: On PR merged

# Runs on every push to master (i.e. a merged PR): bumps the version from the
# merged PR's major/minor/patch label, publishes that version, and deploys
# Storybook. Triggered by push rather than pull_request so the github-pages
# environment sees ref master. Everything is chained with `needs` because
# pushes made with GITHUB_TOKEN, including the release commit, never trigger
# workflows.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (none only redeploys Storybook)
        type: choice
        options: [none, patch, minor, major]
        default: none

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      bump: ${{ steps.bump.outputs.type }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Determine bump type
        id: bump
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "type=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LABELS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[0].labels[]?.name]')
          echo "Merged PR labels: $LABELS"
          if echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"patch"'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v7
        if: steps.bump.outputs.type != 'none'
        with:
          node-version: 22

      - name: Bump version, commit, tag, push
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.bump.outputs.type }} -m "release: v%s"
          git push origin master --follow-tags

      - name: Record released commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  storybook:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - uses: actions/deploy-pages@v4
        id: deployment
