<!-- @dsCard group="Colors" viewport="700x150" name="Dark theme" subtitle="data-theme=dark remaps tones, not hues" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 16px 20px;
        background: var(--color-surface);
      }
      .g {
        display: flex;
        gap: 8px;
      }
      .sw {
        flex: 1;
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 96px;
      }
      .n {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
      }
      .h {
        font-size: 10px;
        font-family: var(--ref-typeface-mono);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="g">
      <div
        class="sw"
        style="background: var(--color-surface); color: var(--color-on-surface)"
      >
        <span class="n">Surface</span><span class="h">#150f0d</span>
      </div>
      <div
        class="sw"
        style="
          background: var(--color-surface-container);
          color: var(--color-on-surface);
        "
      >
        <span class="n">Container</span><span class="h">#241e1b</span>
      </div>
      <div
        class="sw"
        style="
          background: var(--color-surface-container-highest);
          color: var(--color-on-surface);
        "
      >
        <span class="n">Highest</span><span class="h">#3a3330</span>
      </div>
      <div
        class="sw"
        style="background: var(--color-primary); color: var(--color-on-primary)"
      >
        <span class="n">Primary</span><span class="h">#ffb59b</span>
      </div>
      <div
        class="sw"
        style="
          background: var(--color-primary-container);
          color: var(--color-on-primary-container);
        "
      >
        <span class="n">Primary container</span><span class="h">#8c2600</span>
      </div>
      <div
        class="sw"
        style="
          background: var(--color-tertiary);
          color: var(--color-on-tertiary);
        "
      >
        <span class="n">Tertiary</span><span class="h">#4fdcd6</span>
      </div>
    </div>
  </body>
</html>
