<!-- @dsCard group="Colors" viewport="700x150" name="Secondary and tertiary" subtitle="Clay for selection, teal for the counterpoint" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secondary and tertiary</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 16px 20px;
        background: var(--color-surface);
      }
      .g {
        display: flex;
        gap: 8px;
        align-items: stretch;
      }
      .sw {
        flex: 1;
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 96px;
      }
      .n {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
      }
      .h {
        font-size: 10px;
        font-family: var(--ref-typeface-mono);
        opacity: 0.75;
      }
      .lab {
        font-size: 10px;
        font-family: var(--ref-typeface-mono);
        color: var(--color-on-surface-variant);
        letter-spacing: 0.2px;
      }
    </style>
  </head>
  <body>
    <div class="g">
      <div
        class="sw"
        style="
          background: var(--color-secondary);
          color: var(--color-on-secondary);
        "
      >
        <span class="n">Secondary</span><span class="h">#77584b</span>
      </div>
      <div
        class="sw"
        style="
          background: var(--color-secondary-container);
          color: var(--color-on-secondary-container);
        "
      >
        <span class="n">Secondary container</span><span class="h">#ffdbcb</span>
      </div>
      <div
        class="sw"
        style="
          background: var(--color-tertiary);
          color: var(--color-on-tertiary);
        "
      >
        <span class="n">Tertiary</span><span class="h">#006a66</span>
      </div>
      <div
        class="sw"
        style="
          background: var(--color-tertiary-container);
          color: var(--color-on-tertiary-container);
        "
      >
        <span class="n">Tertiary container</span><span class="h">#71f7f0</span>
      </div>
    </div>
  </body>
</html>
