<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px grid, named 1 to 24" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spacing</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 16px 20px;
        background: var(--color-surface);
      }
      .g {
        display: flex;
        gap: 8px;
        align-items: stretch;
      }
      .sw {
        flex: 1;
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 96px;
      }
      .n {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
      }
      .h {
        font-size: 10px;
        font-family: var(--ref-typeface-mono);
        opacity: 0.75;
      }
      .lab {
        font-size: 10px;
        font-family: var(--ref-typeface-mono);
        color: var(--color-on-surface-variant);
        letter-spacing: 0.2px;
      }
    </style>
  </head>
