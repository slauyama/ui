<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Facet Catalog</title>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
html,body{height:100%}
body{background:var(--fx-sys-color-surface-container);overflow:hidden}
#root{height:100vh}
.cat-shell{display:grid;grid-template-columns:300px 1fr;height:100vh}
.cat-main{background:var(--fx-sys-color-surface);border-radius:28px 0 0 28px;overflow-y:auto;position:relative}
.cat-pad{padding:28px 48px 80px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.cat-swatchgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat-table{width:100%;border-spacing:0;font-size:14px}
.cat-table th{background:var(--fx-sys-color-surface-container);text-align:left;font-weight:500}
.cat-table th,.cat-table td{border-top:1px solid var(--fx-sys-color-outline-variant);border-left:1px solid var(--fx-sys-color-outline-variant);padding:8px 16px}
.cat-table tr:last-child td{border-bottom:1px solid var(--fx-sys-color-outline-variant)}
.cat-table tr td:last-child,.cat-table tr th:last-child{border-right:1px solid var(--fx-sys-color-outline-variant)}
.cat-table tr:first-child th:first-child{border-start-start-radius:12px}
.cat-table tr:first-child th:last-child{border-start-end-radius:12px}
.cat-code{background:var(--fx-sys-color-surface-container-high);border-radius:12px;padding:16px 20px;font-family:var(--fx-ref-typeface-mono);font-size:13px;line-height:22px;white-space:pre;overflow-x:auto;color:var(--fx-sys-color-on-surface)}
.cat-figure{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;min-height:140px;padding:28px;border:1px solid var(--fx-sys-color-outline);border-radius:22px}
</style>
</head><body><div id="root"></div>
